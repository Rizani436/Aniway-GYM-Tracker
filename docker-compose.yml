services:
  aniway-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Variabel NEXT_PUBLIC_* harus diteruskan sebagai build arg karena Next.js
      # meng-inline-nya saat build. Nilai diambil dari .env di mesin Anda.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: aniway_gym_tracker
    restart: unless-stopped
    healthcheck:
      # 503 kalau DB tidak terjangkau — status sehat terlihat di `docker ps`,
      # dan wadah lama tetap dipakai sampai wadah baru benar-benar siap saat deploy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Diperlukan agar interpolasi ${...} pada blok build.args di atas terbaca
      # dari file .env di sisi Compose.
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
